<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a3c2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chú Bé Khám Phá Rừng Xanh</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0d2118; font-family:system-ui,'Segoe UI',sans-serif; touch-action:none; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  #loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0d2118; color:#d8f3dc; z-index:50; gap:12px; }
  #loading .bar { width:200px; height:8px; background:#1b4332; border-radius:4px; overflow:hidden; }
  #loading .bar > div { height:100%; width:0%; background:#74c69d; border-radius:4px; transition:width .2s; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="loading">
  <div style="font-size:28px">🎋</div>
  <div>Đang vào rừng...</div>
  <div class="bar"><div id="loadbar"></div></div>
</div>
<script type="module" src="game/main.js"></script>
</body>
</html>
